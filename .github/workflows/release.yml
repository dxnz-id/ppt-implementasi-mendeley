name: Release deck

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Serialisasi per ref: dua push main tidak pernah merilis bersamaan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OFFICECLI_NO_AUTO_RESIDENT: "1"
      OFFICECLI_VERSION: "v1.0.160"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # uv menyediakan Python; build.py hanya memakai stdlib.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      # Carlito metrik-compatible dengan Calibri agar layout PDF tidak bergeser.
      - name: Pasang LibreOffice, font, dan alat pratinjau
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-crosextra-carlito poppler-utils imagemagick

      # Unduh rilis yang dipatok dan verifikasi checksum sebelum dipasang.
      - name: Pasang OfficeCLI
        run: |
          set -euo pipefail
          base="https://github.com/iOfficeAI/OfficeCLI/releases/download/${OFFICECLI_VERSION}"
          dir="$RUNNER_TEMP/officecli"
          mkdir -p "$dir" "$HOME/.local/bin"
          curl -fsSL "$base/officecli-linux-x64" -o "$dir/officecli-linux-x64"
          curl -fsSL "$base/SHA256SUMS" -o "$dir/SHA256SUMS"
          expected=$(awk '$2 == "officecli-linux-x64" { print $1 }' "$dir/SHA256SUMS")
          actual=$(sha256sum "$dir/officecli-linux-x64" | awk '{ print $1 }')
          test -n "$expected"
          test "$expected" = "$actual"
          install -m 755 "$dir/officecli-linux-x64" "$HOME/.local/bin/officecli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/officecli" --version

      - name: Pasang dependensi Node
        run: npm ci --no-audit --no-fund

      - name: Bangun deck
        run: uv run build.py

      - name: Periksa animasi
        run: |
          uv run python test_retarget.py
          uv run python test_check_anim.py
          uv run python check_anim.py

      - name: Periksa tumpang tindih panah
        run: uv run python check_layout.py

      - name: Periksa deck
        run: |
          officecli validate deck.pptx
          set +e
          issues=$(officecli view deck.pptx issues --limit 50 2>&1)
          status=$?
          set -e
          printf '%s\n' "$issues"
          if [ "$status" -ne 0 ] || printf '%s\n' "$issues" | grep -qE 'Found [1-9][0-9]* issue'; then
            echo "::error::OfficeCLI melaporkan masalah layout."
            exit 1
          fi

      - name: Ekspor PDF
        run: |
          soffice --headless --convert-to pdf --outdir . deck.pptx
          test -f deck.pdf

      # Satu contact sheet agar daftar aset rilis tetap bersih.
      - name: Render pratinjau slide
        run: |
          set -euo pipefail
          mkdir -p preview
          pdftoppm -png -r 120 deck.pdf preview/slide
          mapfile -t slides < <(find preview -maxdepth 1 -name 'slide-*.png' | sort -V)
          test "${#slides[@]}" -eq 15
          montage "${slides[@]}" -tile 2x8 -geometry 800x450+8+8 -background '#F6F6F6' preview.png
          test -f preview.png

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-${{ github.sha }}
          path: |
            deck.pptx
            deck.pdf
            preview.png

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deck-${{ github.sha }}

      - name: Ambil SHA pendek
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ steps.meta.outputs.short }}
          name: Build ${{ steps.meta.outputs.short }}
          body: |
            Dibangun otomatis dari commit ${{ github.sha }}.

            <details>
            <summary>Pratinjau 15 slide</summary>

            ![Pratinjau 15 slide](https://github.com/${{ github.repository }}/releases/download/build-${{ steps.meta.outputs.short }}/preview.png)

            </details>

            [Unduh PDF](https://github.com/${{ github.repository }}/releases/download/build-${{ steps.meta.outputs.short }}/deck.pdf) | [Unduh PPTX](https://github.com/${{ github.repository }}/releases/download/build-${{ steps.meta.outputs.short }}/deck.pptx)
          files: |
            deck.pptx
            deck.pdf
            preview.png
          fail_on_unmatched_files: true
          overwrite_files: true
